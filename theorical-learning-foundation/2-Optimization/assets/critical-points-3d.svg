<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
.title{font-family:Georgia,'Times New Roman',serif;font-size:40px;font-weight:700}
.math{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-style:italic}
.label{font-size:25px;font-weight:600}
.axis{stroke:#111827;stroke-width:3}
.grid{stroke:#9ca3af;stroke-width:1.3;opacity:.45}
</style>

<!-- Titles -->
<text x="270" y="70" text-anchor="middle" class="title">Local minimum</text>
<text x="800" y="70" text-anchor="middle" class="title">Local maximum</text>
<text x="1330" y="70" text-anchor="middle" class="title">Saddle point</text>

<text x="270" y="125" text-anchor="middle" class="math">J(x,y) = x² + y²</text>
<text x="800" y="125" text-anchor="middle" class="math">J(x,y) = −x² − y²</text>
<text x="1330" y="125" text-anchor="middle" class="math">J(x,y) = x² − y²</text>

<!-- LEFT: bowl -->
<g transform="translate(35,165)">
  <polygon points="60,450 245,555 455,430 270,325" fill="#dbeafe" stroke="#9ca3af"/>
  <path d="M70 250 C140 470 215 560 270 560 C325 560 400 470 470 250" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M115 285 C165 420 220 485 270 490 C320 485 375 420 425 285" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <path d="M150 330 C190 410 230 445 270 448 C310 445 350 410 390 330" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <path d="M95 230 C165 205 240 205 315 230 C375 250 420 290 450 340" fill="none" stroke="#ef4444" stroke-width="5" opacity=".85"/>
  <path d="M120 260 C180 245 245 245 310 265 C360 280 395 305 420 335" fill="none" stroke="#f97316" stroke-width="4" opacity=".7"/>
  <line x1="60" y1="555" x2="490" y2="555" class="axis"/>
  <line x1="60" y1="555" x2="20" y2="515" class="axis"/>
  <line x1="60" y1="555" x2="60" y2="205" class="axis"/>
  <text x="495" y="570" class="math">y</text><text x="4" y="520" class="math">x</text><text x="5" y="205" class="math">J(x,y)</text>
  <circle cx="270" cy="540" r="10" fill="#111827"/>
  <text x="285" y="520" class="label">minimum</text>
</g>

<!-- CENTER: upside-down bowl -->
<g transform="translate(565,165)">
  <polygon points="60,450 245,555 455,430 270,325" fill="#fee2e2" stroke="#9ca3af"/>
  <path d="M70 520 C140 300 215 210 270 210 C325 210 400 300 470 520" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M115 485 C165 350 220 285 270 280 C320 285 375 350 425 485" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <path d="M150 440 C190 360 230 325 270 322 C310 325 350 360 390 440" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <path d="M95 540 C165 565 240 565 315 540 C375 520 420 480 450 430" fill="none" stroke="#ef4444" stroke-width="5" opacity=".85"/>
  <line x1="60" y1="555" x2="490" y2="555" class="axis"/>
  <line x1="60" y1="555" x2="20" y2="515" class="axis"/>
  <line x1="60" y1="555" x2="60" y2="205" class="axis"/>
  <text x="495" y="570" class="math">y</text><text x="4" y="520" class="math">x</text><text x="5" y="205" class="math">J(x,y)</text>
  <circle cx="270" cy="220" r="10" fill="#111827"/>
  <text x="285" y="200" class="label">maximum</text>
</g>

<!-- RIGHT: saddle -->
<g transform="translate(1095,165)">
  <polygon points="60,450 245,555 455,430 270,325" fill="#f8fafc" stroke="#9ca3af"/>
  <path d="M70 300 C135 430 205 500 270 430 C335 360 405 300 470 390" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M85 460 C150 340 210 300 270 370 C330 440 390 500 455 400" fill="none" stroke="#ef4444" stroke-width="5"/>
  <path d="M115 345 C165 405 220 430 270 400 C320 370 375 360 425 390" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <path d="M125 430 C175 375 225 350 270 385 C315 420 365 440 415 410" fill="none" stroke="#f97316" stroke-width="3"/>
  <line x1="60" y1="555" x2="490" y2="555" class="axis"/>
  <line x1="60" y1="555" x2="20" y2="515" class="axis"/>
  <line x1="60" y1="555" x2="60" y2="205" class="axis"/>
  <text x="495" y="570" class="math">y</text><text x="4" y="520" class="math">x</text><text x="5" y="205" class="math">J(x,y)</text>
  <circle cx="270" cy="390" r="10" fill="#111827"/>
  <text x="285" y="375" class="label">saddle</text>
</g>

<!-- Legend -->
<defs>
  <linearGradient id="g" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#2563eb"/>
    <stop offset="50%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#dc2626"/>
  </linearGradient>
</defs>
<rect x="550" y="800" width="500" height="28" fill="url(#g)" stroke="#9ca3af"/>
<text x="540" y="865" text-anchor="start" class="label">Lower values</text>
<text x="1060" y="865" text-anchor="end" class="label">Higher values</text>
</svg>