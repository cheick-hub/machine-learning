<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
.title{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-style:italic}
.math{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic}
.label{font-size:24px}
.note{font-size:24px;font-weight:600}
</style>

<text x="700" y="58" text-anchor="middle" class="title">J(θ) = θ⁴ − 3θ² + 1</text>

<!-- axes -->
<line x1="100" y1="690" x2="1310" y2="690" stroke="#111827" stroke-width="3"/>
<line x1="700" y1="100" x2="700" y2="735" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="10 9"/>
<line x1="100" y1="410" x2="1310" y2="410" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="10 9"/>
<text x="1322" y="707" class="math">θ</text>
<text x="42" y="400" class="math">J(θ)</text>

<!-- accurate qualitative quartic -->
<path d="M150 125
C205 330 270 535 350 610
C430 685 515 570 585 470
C630 405 670 360 700 350
C730 360 770 405 815 470
C885 570 970 685 1050 610
C1130 535 1195 330 1250 125"
fill="none" stroke="#1976d2" stroke-width="6"/>

<!-- local maximum -->
<circle cx="700" cy="350" r="11" fill="#e52521"/>
<text x="745" y="315" class="math">J(0)=1 &gt; -1</text>
<text x="700" y="330" text-anchor="middle" class="label">Local maximum (0,1)</text>

<!-- points theta=-1 and theta=1 -->
<circle cx="405" cy="590" r="11" fill="#e52521"/>
<circle cx="995" cy="590" r="11" fill="#e52521"/>
<text x="330" y="560" class="label">(-1,-1)</text>
<text x="940" y="560" class="label">(1,-1)</text>

<!-- chord -->
<line x1="405" y1="590" x2="995" y2="590" stroke="#e52521" stroke-width="6"/>
<text x="700" y="635" text-anchor="middle" class="note" fill="#e52521">Chord value at θ = 0 is -1</text>

<!-- true minima at ±sqrt(3/2), value -5/4 -->
<circle cx="350" cy="610" r="11" fill="#0a9f38"/>
<circle cx="1050" cy="610" r="11" fill="#0a9f38"/>
<line x1="350" y1="690" x2="350" y2="705" stroke="#111827" stroke-width="3"/>
<line x1="1050" y1="690" x2="1050" y2="705" stroke="#111827" stroke-width="3"/>
<text x="350" y="745" text-anchor="middle" class="math">−√(3/2)</text>
<text x="1050" y="745" text-anchor="middle" class="math">√(3/2)</text>
<text x="350" y="665" text-anchor="middle" class="label">Local minimum</text>
<text x="1050" y="665" text-anchor="middle" class="label">Local minimum</text>

<text x="700" y="792" text-anchor="middle" class="label">
The graph lies above the chord at θ = 0, so the convexity inequality is violated.
</text>
</svg>