<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315"><rect width="1000" height="315" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#253247}.heading{font-weight:700;font-size:24px}.symbol{font-weight:700;font-size:27px}.desc{font-size:17px}.sub{font-size:16px}</style><text x="28" y="40" class="heading">A = V Λ V⁻¹: three successive operations</text><g transform="translate(15,86)"><rect width="205" height="112" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="102" y="45" text-anchor="middle" class="symbol">V⁻¹</text><text x="102" y="77" text-anchor="middle" class="desc">Change coordinates</text><text x="102" y="100" text-anchor="middle" class="sub">to the eigenbasis</text></g><path d="M235 141H302" stroke="#0d9488" stroke-width="4"/><polygon points="302,141 286,133 286,149" fill="#0d9488"/><g transform="translate(318,86)"><rect width="205" height="112" rx="12" fill="#ecfdf5" stroke="#0d9488"/><text x="102" y="45" text-anchor="middle" class="symbol">Λ</text><text x="102" y="77" text-anchor="middle" class="desc">Scale along</text><text x="102" y="100" text-anchor="middle" class="sub">eigenvector directions</text></g><path d="M539 141H606" stroke="#0d9488" stroke-width="4"/><polygon points="606,141 590,133 590,149" fill="#0d9488"/><g transform="translate(622,86)"><rect width="205" height="112" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="102" y="45" text-anchor="middle" class="symbol">V</text><text x="102" y="77" text-anchor="middle" class="desc">Return to original</text><text x="102" y="100" text-anchor="middle" class="sub">coordinates</text></g><text x="30" y="255" class="desc">For an input x, evaluate from right to left: Ax = V(Λ(V⁻¹x)).</text><text x="30" y="285" class="sub">Diagonalization requires n linearly independent eigenvectors.</text></svg>